# Rotation des logs Docker (pilote json-file) : sans elle, chaque conteneur écrit dans
# un fichier qui grossit SANS LIMITE sur le disque du serveur. 5 × 10 Mo par conteneur.
# `x-` = champ d'extension ignoré par Compose ; `&` / `*` = ancre / alias YAML (une
# seule définition, réutilisée par chaque service).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    # ${TAG:-main} : vaut "main" par défaut. Le rollback se fait par
    #   TAG=sha-eac1bda docker compose up -d
    # sans jamais modifier ce fichier sur le serveur (principe 7).
    image: ghcr.io/gregtmlg/cooking-app-backend:${TAG:-main}
    volumes:
      - /srv/data/cooking:/app/data
    env_file:
      - ./backend.env
    restart: unless-stopped
    logging: *default-logging

  frontend:
    image: ghcr.io/gregtmlg/cooking-app-frontend:${TAG:-main}
    # Boucle locale UNIQUEMENT : seul cloudflared (sur l'hôte) doit joindre Nginx.
    # Sinon, un client du réseau local / Tailscale pourrait forger CF-Connecting-IP
    # et contourner le rate-limiting du login. Docker contourne ufw : seule cette
    # liaison garantit la fermeture.
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging