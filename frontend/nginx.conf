# Relaie le X-Forwarded-Proto reçu de cloudflared.
# Si absent (accès direct en local), retombe sur le schéma vu par Nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;

    # Sert les fichiers statiques React
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxifie les appels API vers le backend
    location /api/ {
        # Force la re-résolution DNS à l'exécution (DNS interne Docker),
        # sinon Nginx fige l'IP du backend au démarrage -> 502 après redéploiement.
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        proxy_pass $backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}